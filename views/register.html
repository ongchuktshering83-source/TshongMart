<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tshongmart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #DDECF6; }
        .navbar { background: white; padding: 1rem; box-shadow: 0 2px 8px rgba(24,78,108,0.1); }
        .container { max-width: 500px; margin: 0 auto; padding: 0 1.5rem; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #184E6C; display: inline-block; }
        .logo span { color: #5BA3C6; }
        .nav-links { float: right; margin-top: 8px; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: #387EA2; }
        .clearfix { clear: both; }
        .register-card { background: white; border-radius: 16px; padding: 2rem; margin: 2rem 0; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #184E6C; font-weight: 500; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #9BCBE5; border-radius: 8px; }
        .btn-primary { background: #387EA2; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-primary:hover { background: #184E6C; }
        .footer { background: #184E6C; color: #9BCBE5; padding: 2rem; margin-top: 2rem; text-align: center; }
        .admin-section { border-top: 1px solid #DDECF6; margin-top: 1rem; padding-top: 1rem; }
        .admin-section summary { color: #387EA2; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="logo">Tshong<span>mart</span></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/contact">Contact</a>
                <a href="/login">Login</a>
            </div>
            <div class="clearfix"></div>
        </div>
    </div>

    <div class="container">
        <div class="register-card">
            <h1 style="color: #184E6C; margin-bottom: 1.5rem; text-align: center;">Create Account</h1>
            <form method="POST" action="/register">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" placeholder="Min 6 characters" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" placeholder="Phone number">
                </div>
                <div class="form-group">
                    <label>I want to</label>
                    <select name="role">
                        <option value="buyer">Buy products</option>
                        <option value="seller">Sell products</option>
                        <option value="both">Both buy and sell</option>
                    </select>
                </div>
                
                <details class="admin-section">
                    <summary>🔑 Admin Registration (Authorized Personnel Only)</summary>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label>Admin Access Code</label>
                        <input type="password" name="admin_code" placeholder="Enter admin code">
                        <small style="color: #666; display: block; margin-top: 0.3rem;">Only enter if you have been given access</small>
                    </div>
                </details>
                
                <button type="submit" class="btn-primary">Register</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>&copy; 2024 Tshongmart. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
