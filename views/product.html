<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Tshongmart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #DDECF6; }
        .navbar { background: white; padding: 1rem; box-shadow: 0 2px 8px rgba(24,78,108,0.1); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #184E6C; }
        .logo span { color: #5BA3C6; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; float: right; }
        .nav-links a { text-decoration: none; color: #387EA2; }
        .clearfix { clear: both; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .product-card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; }
        .price { font-size: 1.5rem; font-weight: bold; color: #184E6C; margin: 0.5rem 0; }
        .condition { display: inline-block; background: #DDECF6; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .contact-links { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
        .whatsapp-link { background: #25D366; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.8rem; display: inline-block; }
        .telegram-link { background: #0088cc; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.8rem; display: inline-block; }
        .btn-primary { background: #387EA2; color: white; padding: 0.6rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; }
        .footer { background: #184E6C; color: #9BCBE5; padding: 2rem; margin-top: 2rem; text-align: center; }
        button { background: #387EA2; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 0.5rem; }
        @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="logo">Tshong<span>mart</span></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/contact">Contact</a>
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            </div>
            <div class="clearfix"></div>
        </div>
    </div>

        <div class="container">
            <div class="logo">Tshong<span>mart</span></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/profile">Profile</a>
                <a href="/contact">Contact</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
            <div class="clearfix"></div>
        </div>
    </div> -->

    <div class="container">
        <h1>All Products</h1>
        <p style="color: #387EA2; margin-bottom: 2rem;">Browse second-hand automation equipment and commercial products</p>
        <div id="products-container" class="product-grid">
            <div class="loading">Loading products...</div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>&copy; 2024 Tshongmart. All rights reserved.</p>
        </div>
    </div>

    <script>
        function loadProducts() {
            fetch('/api/products')
                .then(response => response.json())
                .then(products => {
                    const container = document.getElementById('products-container');
                    
                    if (!products || products.length === 0) {
                        container.innerHTML = '<div class="error">No products available.</div>';
                        return;
                    }
                    
                    container.innerHTML = products.map(p => {
                        let contactHtml = '';
                        if (p.whatsapp && p.whatsapp !== '') {
                            contactHtml += `<a href="${p.whatsapp}" target="_blank" class="whatsapp-link">📱 WhatsApp</a>`;
                        }
                        if (p.telegram && p.telegram !== '') {
                            contactHtml += `<a href="${p.telegram}" target="_blank" class="telegram-link">✈️ Telegram</a>`;
                        }
                        
                        return `
                            <div class="product-card">
                                ${p.image_url && p.image_url !== '' ? 
                                    `<img src="${p.image_url}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">` : 
                                    `<div style="height:200px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; border-radius:8px; margin-bottom:1rem;">📷 No Image</div>`}
                                <h3>${escapeHtml(p.title)}</h3>
                                <p>${escapeHtml((p.description || '').substring(0, 150))}${p.description && p.description.length > 150 ? '...' : ''}</p>
                                <div class="price">Nu. ${(p.price || 0).toLocaleString()}</div>
                                <span class="condition">${escapeHtml(p.condition || 'Not specified')}</span>
                                <div class="contact-links">
                                    ${contactHtml}
                                </div>
                                <p style="margin-top:0.5rem; font-size:0.8rem; color:#666;"><strong>Seller:</strong> ${escapeHtml(p.seller || 'Tshongmart')}</p>
                                <button onclick="addToCart(${p.id})">Add to Cart 🛒</button>
                            </div>
                        `;
                    }).join('');
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('products-container').innerHTML = '<div class="error">Error loading products.</div>';
                });
        }

        function addToCart(productId) {
            fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId, quantity: 1 })
            })
            .then(res => res.json())
            .then(() => alert('✅ Added to cart!'))
            .catch(() => alert('Please login first'));
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadProducts();
    </script>
</body>
</html>
