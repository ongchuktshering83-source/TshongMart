<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Tshongmart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #DDECF6; }
        .navbar { background: white; padding: 1rem; box-shadow: 0 2px 8px rgba(24,78,108,0.1); }
        .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #184E6C; display: inline-block; }
        .logo span { color: #5BA3C6; }
        .nav-links { float: right; margin-top: 8px; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: #387EA2; cursor: pointer; }
        .clearfix { clear: both; }
        .profile-card { background: white; border-radius: 16px; padding: 2rem; margin: 2rem 0; }
        .avatar-section { text-align: center; margin-bottom: 2rem; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #387EA2; background: #DDECF6; }
        .default-avatar { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #184E6C, #387EA2); display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 3px solid #5BA3C6; }
        .default-avatar span { font-size: 48px; color: white; }
        .avatar-upload { margin-top: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #184E6C; font-weight: 500; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #9BCBE5; border-radius: 8px; }
        .btn-primary { background: #387EA2; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-secondary { background: #9BCBE5; color: #184E6C; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; margin-top: 1rem; width: 100%; }
        .alert-success { background: #d4edda; color: #155724; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        hr { margin: 1.5rem 0; border: none; border-top: 1px solid #DDECF6; }
        .footer { background: #184E6C; color: #9BCBE5; padding: 2rem; margin-top: 2rem; text-align: center; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="logo">Tshong<span>mart</span></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/profile">Profile</a>
                <a href="/contact">Contact</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
            <div class="clearfix"></div>
        </div>
    </div>
    <!-- <div class="navbar">
        <div class="container">
            <div class="logo">Tshong<span>mart</span></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/profile">Profile</a>
                <a href="/contact">Contact</a>
               <a href="#" onclick="logout()">Logout</a>
            </div>
            <div class="clearfix"></div>
        </div>
    </div> -->

    <div class="container">
        <div class="profile-card">
            <div class="avatar-section">
                <div id="avatarContainer">
                    <div class="default-avatar">
                        <span>👤</span>
                    </div>
                </div>
                <div class="avatar-upload">
                    <input type="file" id="avatarInput" accept="image/*" style="display:none">
                    <button class="btn-secondary" onclick="document.getElementById('avatarInput').click()">Change Avatar</button>
                </div>
            </div>

            <div id="alert-success" class="alert-success"></div>
            <div id="alert-error" class="alert-error"></div>

            <form id="profileForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" disabled style="background:#f5f5f5;">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="role" disabled style="background:#f5f5f5;">
                </div>
                <button type="submit" class="btn-primary">Update Profile</button>
            </form>

            <hr>

            <h3>Change Password</h3>
            <form id="passwordForm">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="currentPassword" placeholder="Enter current password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <button type="submit" class="btn-primary">Change Password</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>&copy; 2024 Tshongmart. All rights reserved.</p>
        </div>
    </div>

    <script>
        function updateAvatarDisplay(avatarUrl) {
            const container = document.getElementById('avatarContainer');
            if (avatarUrl && avatarUrl !== '') {
                container.innerHTML = `<img class="avatar" src="${avatarUrl}" alt="Avatar">`;
            } else {
                container.innerHTML = `<div class="default-avatar"><span>👤</span></div>`;
            }
        }

        // Load profile data
        function loadProfile() {
            fetch('/api/user/profile')
                .then(res => res.json())
                .then(user => {
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('fullName').value = user.full_name || '';
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('role').value = user.role || 'buyer';
                    updateAvatarDisplay(user.avatar_url);
                })
                .catch(err => console.error('Error loading profile:', err));
        }

        // Update profile
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const data = {
                full_name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value
            };
            
            fetch('/api/user/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(() => {
                showAlert('Profile updated successfully!', 'success');
                loadProfile();
            })
            .catch(err => {
                showAlert('Error updating profile', 'error');
                console.error(err);
            });
        });

        // Change password
        document.getElementById('passwordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('New passwords do not match', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }
            
            const data = {
                current_password: document.getElementById('currentPassword').value,
                new_password: newPassword
            };
            
            fetch('/api/user/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(() => {
                showAlert('Password changed successfully!', 'success');
                document.getElementById('passwordForm').reset();
            })
            .catch(err => {
                showAlert('Current password is incorrect', 'error');
                console.error(err);
            });
        });

        // Upload avatar
        document.getElementById('avatarInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('avatar', file);
            
            fetch('/api/user/upload-avatar', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.avatar_url) {
                    updateAvatarDisplay(data.avatar_url);
                    showAlert('Avatar updated successfully!', 'success');
                }
            })
            .catch(err => {
                showAlert('Error uploading avatar', 'error');
                console.error(err);
            });
        });

        function showAlert(message, type) {
            const alertDiv = document.getElementById(`alert-${type}`);
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        function logout() {
            fetch('/logout', { method: 'POST' }).then(() => window.location.href = '/');
        }

        loadProfile();
    </script>
</body>
</html>
