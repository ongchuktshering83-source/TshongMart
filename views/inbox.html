<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Tshongmart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #DDECF6; }
        .navbar { background: white; padding: 1rem; box-shadow: 0 2px 8px rgba(24,78,108,0.1); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #184E6C; display: inline-block; }
        .logo span { color: #5BA3C6; }
        .nav-links { float: right; margin-top: 8px; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: #387EA2; }
        .clearfix { clear: both; }
        .inbox-container { background: white; border-radius: 16px; padding: 2rem; margin: 2rem 0; }
        .message-card { border: 1px solid #DDECF6; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; cursor: pointer; }
        .message-card:hover { background: #DDECF6; }
        .message-unread { background: #E8F4F8; border-left: 4px solid #387EA2; }
        .btn-primary { background: #387EA2; color: white; padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; }
        .compose-form { background: #f9f9f9; padding: 1rem; border-radius: 12px; margin-bottom: 2rem; }
        input, textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #9BCBE5; border-radius: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; max-width: 500px; margin: 100px auto; padding: 2rem; border-radius: 16px; }
        .footer { background: #184E6C; color: #9BCBE5; padding: 2rem; margin-top: 2rem; text-align: center; }
        .unread-badge { background: #dc3545; color: white; border-radius: 50%; padding: 0.2rem 0.5rem; font-size: 0.7rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="logo">Tshong<span>mart</span></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/inbox">Inbox</a>
                <a href="/profile">Profile</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
            <div class="clearfix"></div>
        </div>
    </div>

    <div class="container">
        <div class="inbox-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1 style="color: #184E6C;">📬 My Inbox</h1>
                <button class="btn-primary" onclick="showCompose()">+ New Message</button>
            </div>
            <div id="compose-form" class="compose-form" style="display: none;">
                <h3>Send Message to Admin</h3>
                <input type="text" id="message-subject" placeholder="Subject">
                <textarea id="message-body" rows="4" placeholder="Write your message here..."></textarea>
                <button class="btn-primary" onclick="sendMessage()">Send</button>
                <button onclick="hideCompose()">Cancel</button>
            </div>
            <div id="messages-list">Loading...</div>
        </div>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-subject"></h3>
            <p><strong>From:</strong> <span id="modal-from"></span></p>
            <p><strong>Date:</strong> <span id="modal-date"></span></p>
            <hr>
            <p id="modal-message" style="margin-top:1rem;"></p>
            <button class="btn-primary" onclick="closeModal()" style="margin-top:1rem;">Close</button>
        </div>
    </div>

    <div class="footer"><div class="container"><p>&copy; 2024 Tshongmart</p></div></div>

    <script>
        let currentUserRole = '';
        
        fetch('/api/user/profile').then(res => res.json()).then(user => { currentUserRole = user.role; loadMessages(); loadUnreadCount(); });
        
        function loadMessages() {
            fetch('/api/messages').then(res => res.json()).then(messages => {
                const container = document.getElementById('messages-list');
                if (!messages || messages.length === 0) { container.innerHTML = '<p>No messages yet.</p>'; return; }
                container.innerHTML = messages.map(m => `<div class="message-card ${!m.is_read ? 'message-unread' : ''}" onclick="viewMessage(${m.id}, '${escapeHtml(m.subject)}', '${escapeHtml(m.message)}', '${escapeHtml(m.from_name || m.from_email)}', '${m.created_at}')"><div class="message-subject"><strong>${escapeHtml(m.subject)}</strong>${!m.is_read ? '<span class="unread-badge">New</span>' : ''}</div><div class="message-meta" style="font-size:0.8rem;color:#666;">From: ${escapeHtml(m.from_name || m.from_email)} | ${new Date(m.created_at).toLocaleString()}</div><div style="font-size:0.9rem;margin-top:0.5rem;">${escapeHtml(m.message.substring(0, 100))}...</div></div>`).join('');
            });
        }
        
        function viewMessage(id, subject, message, from, date) {
            document.getElementById('modal-subject').innerText = subject;
            document.getElementById('modal-from').innerText = from;
            document.getElementById('modal-date').innerText = new Date(date).toLocaleString();
            document.getElementById('modal-message').innerText = message;
            document.getElementById('messageModal').style.display = 'block';
            fetch(`/api/messages/${id}/read`, { method: 'PUT' }).then(() => { loadMessages(); loadUnreadCount(); });
        }
        
        function showCompose() { document.getElementById('compose-form').style.display = 'block'; }
        function hideCompose() { document.getElementById('compose-form').style.display = 'none'; document.getElementById('message-subject').value = ''; document.getElementById('message-body').value = ''; }
        
        function sendMessage() {
            const subject = document.getElementById('message-subject').value;
            const message = document.getElementById('message-body').value;
            if (!subject || !message) { alert('Please fill both fields'); return; }
            fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subject: subject, message: message, to_user_id: 0 }) }).then(() => { alert('Message sent to admin!'); hideCompose(); loadMessages(); });
        }
        
        function loadUnreadCount() {
            fetch('/api/messages/unread-count').then(res => res.json()).then(data => { if (data.unread_count > 0) { document.title = `(${data.unread_count}) Inbox - Tshongmart`; } });
        }
        
        function closeModal() { document.getElementById('messageModal').style.display = 'none'; }
        function logout() { fetch('/logout', { method: 'POST' }).then(() => window.location.href = '/'); }
        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        setInterval(() => { loadMessages(); loadUnreadCount(); }, 30000);
    </script>
</body>
</html>
